<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duskmoor · Three Crowns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/duskmoor.css">
  <script src="js/smoke.js"></script>
</head>
<body>
  <!-- Background: the Duskmoor landscape, fog and drifting motes -->
  <div class="bg" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <canvas id="motes" aria-hidden="true"></canvas>
  <div class="fog" aria-hidden="true"></div>

  <header class="topbar">
    <a class="nav-link" href="index.html" data-smoke>Back to title</a>

    <div class="realm-title">
      <svg class="sigil" viewBox="0 0 60 60" aria-hidden="true">
        <defs>
          <linearGradient id="sigil-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#efe4ff"/>
            <stop offset=".5" stop-color="#a77be0"/>
            <stop offset="1" stop-color="#4b2272"/>
          </linearGradient>
        </defs>
        <path d="M38 8 A22 22 0 1 0 54 40 A17 17 0 1 1 38 8 Z" fill="url(#sigil-grad)"/>
      </svg>
      <h1>Duskmoor</h1>
    </div>

    <a class="nav-link nav-link--button" href="cards.html" data-smoke>Cards of Duskmoor</a>
  </header>

  <main class="hero-select">
    <section class="hero-stage" aria-live="polite">
      <div class="portrait" id="portrait">
        <img id="portrait-img" src="" alt="">
      </div>
      <div class="hero-info" id="hero-info"></div>
    </section>

    <nav class="roster" id="roster" aria-label="Choose your hero"></nav>
  </main>

  <script src="js/duskmoor.js"></script>
</body>
</html>
