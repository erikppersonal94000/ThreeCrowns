<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Library · Three Crowns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cards.css">
</head>
<body>
  <!-- ================================================================
       Shared pieces for every card frame (Style A uses these)
       ================================================================ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="cf-iron" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2e2436"/>
        <stop offset=".5" stop-color="#0c0910"/>
        <stop offset="1" stop-color="#241a2c"/>
      </linearGradient>
      <linearGradient id="cf-bone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ece5ef"/>
        <stop offset="1" stop-color="#8a8194"/>
      </linearGradient>
      <linearGradient id="cf-plate" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2d1b42"/>
        <stop offset="1" stop-color="#110a1a"/>
      </linearGradient>
      <linearGradient id="cf-textbox" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a1226"/>
        <stop offset="1" stop-color="#0b0811"/>
      </linearGradient>
      <linearGradient id="cf-gem" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e3c6ff"/>
        <stop offset=".5" stop-color="#8a4dd6"/>
        <stop offset="1" stop-color="#2d0f52"/>
      </linearGradient>
      <radialGradient id="cf-gem-radial" cx=".4" cy=".35" r=".7">
        <stop offset="0" stop-color="#f0dcff"/>
        <stop offset=".35" stop-color="#9b5ce6"/>
        <stop offset=".8" stop-color="#3b1466"/>
        <stop offset="1" stop-color="#1a0830"/>
      </radialGradient>
      <radialGradient id="cf-art-vignette" cx=".5" cy=".42" r=".75">
        <stop offset=".5" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".85"/>
      </radialGradient>
      <radialGradient id="cb-bg" cx=".5" cy=".45" r=".75">
        <stop offset="0" stop-color="#2a1340"/>
        <stop offset=".6" stop-color="#110a1a"/>
        <stop offset="1" stop-color="#050308"/>
      </radialGradient>
      <pattern id="cb-lattice" patternUnits="userSpaceOnUse" width="40" height="40">
        <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="none" stroke="#2a1a3d" stroke-width="1"/>
      </pattern>

      <clipPath id="cf-arch">
        <path d="M40 392 V160 Q40 100 250 70 Q460 100 460 160 V392 Z"/>
      </clipPath>

      <g id="cf-vertebra">
        <rect x="-5" y="0" width="10" height="14" rx="3" fill="url(#cf-bone)"/>
        <rect x="-7" y="5" width="14" height="4" rx="2" fill="url(#cf-bone)" opacity=".8"/>
      </g>

      <g id="cf-bone-piece" fill="url(#cf-bone)" stroke="#4a4052" stroke-width=".6">
        <rect x="-18" y="-3" width="36" height="6" rx="3"/>
        <circle cx="-18" cy="-3.2" r="4"/><circle cx="-18" cy="3.2" r="4"/>
        <circle cx="18" cy="-3.2" r="4"/><circle cx="18" cy="3.2" r="4"/>
      </g>

      <g id="cf-skull" stroke="#1e1428" stroke-width=".8">
        <path fill="url(#cf-bone)" d="M0 -22 C-14 -22 -20 -11 -20 -1 C-20 7 -16 12 -12 14 V21 H12 V14 C16 12 20 7 20 -1 C20 -11 14 -22 0 -22 Z"/>
        <path fill="none" d="M2 -21 L0 -14 L4 -10 L1 -4 M-12 15 H12 M-6 15 V21 M-2 15 V21 M2 15 V21 M6 15 V21"/>
        <ellipse cx="-7" cy="0" rx="4.5" ry="5" fill="#0a0610"/>
        <ellipse cx="7" cy="0" rx="4.5" ry="5" fill="#0a0610"/>
        <path d="M0 5 L-2.5 10 H2.5 Z" fill="#0a0610"/>
        <circle class="cf-eye-glow" cx="-7" cy="1" r="1.6" fill="#b36bff" stroke="none"/>
        <circle class="cf-eye-glow" cx="7" cy="1" r="1.6" fill="#b36bff" stroke="none"/>
      </g>

      <filter id="fx-cglow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>

  <!-- ================================================================
       Materials for card styles B (painted) and C (realistic)
       ================================================================ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- ===== Style B: painted pewter & enamel ===== -->
      <linearGradient id="fb-metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a4058"/>
        <stop offset=".35" stop-color="#1d1726"/>
        <stop offset=".5" stop-color="#0e0a14"/>
        <stop offset=".75" stop-color="#2a2236"/>
        <stop offset="1" stop-color="#120d19"/>
      </linearGradient>
      <linearGradient id="fb-metal-h" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5a4d6c"/>
        <stop offset=".5" stop-color="#1a1422"/>
        <stop offset="1" stop-color="#34293f"/>
      </linearGradient>
      <linearGradient id="fb-panel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a1422"/>
        <stop offset="1" stop-color="#0b0810"/>
      </linearGradient>
      <radialGradient id="fb-enamel" cx=".5" cy=".4" r=".7">
        <stop offset="0" stop-color="#4a1f7a"/>
        <stop offset="1" stop-color="#1c0a33"/>
      </radialGradient>
      <linearGradient id="fb-inset" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#171021"/>
        <stop offset="1" stop-color="#0a0710"/>
      </linearGradient>
      <linearGradient id="fb-bone" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f2ecf5"/>
        <stop offset=".5" stop-color="#b9aec4"/>
        <stop offset="1" stop-color="#5d546a"/>
      </linearGradient>
      <linearGradient id="fb-horn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a3e56"/>
        <stop offset="1" stop-color="#0e0a12"/>
      </linearGradient>
      <linearGradient id="fb-crescent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e6ccff"/>
        <stop offset=".5" stop-color="#9b5ce6"/>
        <stop offset="1" stop-color="#3b1466"/>
      </linearGradient>

      <clipPath id="fb-tb-clip"><rect x="48" y="476" width="404" height="148" rx="6"/></clipPath>
      <clipPath id="fb-heart-clip">
        <path d="M440 686 C414 668 402 654 402 640 C402 628 411 620 421 620 C430 620 436 626 440 632 C444 626 450 620 459 620 C469 620 478 628 478 640 C478 654 466 668 440 686 Z"/>
      </clipPath>

      <filter id="fb-metalfx" x="-3%" y="-3%" width="106%" height="106%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9 0.22" numOctaves="2" seed="5" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0" result="g"/>
        <feComponentTransfer in="g" result="lift">
          <feFuncR type="linear" slope=".35" intercept=".8"/>
          <feFuncG type="linear" slope=".35" intercept=".8"/>
          <feFuncB type="linear" slope=".35" intercept=".8"/>
          <feFuncA type="linear" slope="0" intercept="1"/>
        </feComponentTransfer>
        <feBlend in="SourceGraphic" in2="lift" mode="multiply" result="tex"/>
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="bump"/>
        <feSpecularLighting in="bump" surfaceScale="3.5" specularConstant=".8" specularExponent="20" lighting-color="#d9c4ff" result="spec">
          <fePointLight x="420" y="-120" z="260"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
        <feComposite in="tex" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
        <feComposite in="lit" in2="SourceAlpha" operator="in"/>
      </filter>

      <filter id="fb-bonefx" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="bump"/>
        <feSpecularLighting in="bump" surfaceScale="2.5" specularConstant=".6" specularExponent="16" lighting-color="#ffffff" result="spec">
          <fePointLight x="420" y="-120" z="260"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="s"/>
        <feComposite in="SourceGraphic" in2="s" operator="arithmetic" k1="0" k2="1" k3=".8" k4="0"/>
      </filter>

      <filter id="fb-canvasfx" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="3" seed="12" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0" result="g"/>
        <feComponentTransfer in="g" result="lift">
          <feFuncR type="linear" slope=".5" intercept=".7"/>
          <feFuncG type="linear" slope=".5" intercept=".7"/>
          <feFuncB type="linear" slope=".5" intercept=".7"/>
          <feFuncA type="linear" slope="0" intercept="1"/>
        </feComponentTransfer>
        <feBlend in="SourceGraphic" in2="lift" mode="multiply" result="t"/>
        <feComposite in="t" in2="SourceGraphic" operator="in"/>
      </filter>

      <filter id="fb-glow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="fb-blur4" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4"/>
      </filter>

      <g id="fb-skull">
        <path fill="url(#fb-bone)" d="M0 -22 C-14 -22 -20 -11 -20 -1 C-20 7 -16 12 -12 14 V21 H12 V14 C16 12 20 7 20 -1 C20 -11 14 -22 0 -22 Z"/>
        <path fill="#000" opacity=".35" d="M-20 -1 C-20 7 -16 12 -12 14 V21 H-2 V12 C-9 10 -15 6 -16 -4 Z"/>
        <path fill="#fff" opacity=".35" d="M-10 -18 Q2 -23 12 -16 Q2 -19 -10 -18 Z"/>
        <ellipse cx="-7" cy="0" rx="5" ry="5.5" fill="#07040b"/>
        <ellipse cx="7" cy="0" rx="5" ry="5.5" fill="#07040b"/>
        <path d="M0 5 L-2.6 10 Q0 11 2.6 10 Z" fill="#07040b"/>
        <path d="M-12 14 H12 M-8 15.5 V21 M-4 15.5 V21 M0 15.5 V21 M4 15.5 V21 M8 15.5 V21" stroke="#3a3144" stroke-width=".8"/>
        <path d="M3 -21 L1 -14 L5 -10 L2 -4" fill="none" stroke="#3a3144" stroke-width=".8"/>
        <circle class="cf-eye-glow" cx="-7" cy="1" r="2.2" fill="#c08cff" filter="url(#fb-glow)"/>
        <circle class="cf-eye-glow" cx="7" cy="1" r="2.2" fill="#c08cff" filter="url(#fb-glow)"/>
      </g>

      <g id="fb-vertebra">
        <rect x="-5.5" y="0" width="11" height="14" rx="3.5" fill="url(#fb-bone)"/>
        <path d="M-8 6 L-5.5 4.5 V9.5 L-8 8 Z M8 6 L5.5 4.5 V9.5 L8 8 Z" fill="url(#fb-bone)"/>
        <rect x="-5.5" y="10" width="11" height="4" rx="2" fill="#000" opacity=".3"/>
      </g>

      <g id="fb-bone-piece">
        <rect x="-18" y="-3" width="36" height="6" rx="3" fill="url(#fb-bone)"/>
        <circle cx="-18" cy="-3.2" r="4" fill="url(#fb-bone)"/><circle cx="-18" cy="3.2" r="4" fill="url(#fb-bone)"/>
        <circle cx="18" cy="-3.2" r="4" fill="url(#fb-bone)"/><circle cx="18" cy="3.2" r="4" fill="url(#fb-bone)"/>
        <rect x="-18" y="1" width="36" height="2" rx="1" fill="#000" opacity=".3"/>
      </g>

      <g id="fb-gem" class="cf-gem">
        <path d="M0 -9 L9 0 L0 9 L-9 0 Z" fill="#2a0c4f"/>
        <path d="M0 -9 L9 0 L0 0 Z" fill="#e3c6ff"/>
        <path d="M0 -9 L-9 0 L0 0 Z" fill="#9b5ce6"/>
        <path d="M-9 0 L0 9 L0 0 Z" fill="#5b24a0"/>
        <path d="M9 0 L0 9 L0 0 Z" fill="#7a3cd0"/>
        <path d="M0 -9 L9 0 L0 9 L-9 0 Z" fill="none" stroke="#0a0610" stroke-width="1"/>
        <circle cx="2" cy="-3" r="1.2" fill="#fff"/>
      </g>

      <!-- ===== Style C: realistic iron, bone & leather ===== -->
      <linearGradient id="fc-bone-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e6ddcb"/>
        <stop offset=".5" stop-color="#a89c86"/>
        <stop offset="1" stop-color="#5a5044"/>
      </linearGradient>
      <linearGradient id="fc-horn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6a5e52"/>
        <stop offset="1" stop-color="#2a241f"/>
      </linearGradient>
      <radialGradient id="fc-cranium" cx=".45" cy=".35" r=".7">
        <stop offset="0" stop-color="#ece4d4"/>
        <stop offset=".55" stop-color="#b3a78f"/>
        <stop offset="1" stop-color="#5e5446"/>
      </radialGradient>
      <radialGradient id="fc-socket" cx=".5" cy=".55" r=".6">
        <stop offset="0" stop-color="#000"/>
        <stop offset=".75" stop-color="#0a0608"/>
        <stop offset="1" stop-color="#2c2420"/>
      </radialGradient>
      <linearGradient id="fc-amethyst" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#d7b6ff"/>
        <stop offset=".45" stop-color="#7a3cd0"/>
        <stop offset="1" stop-color="#2a0c4f"/>
      </linearGradient>
      <radialGradient id="fc-amethyst-r" cx=".4" cy=".35" r=".7">
        <stop offset="0" stop-color="#caa0ff"/>
        <stop offset=".45" stop-color="#6d2fc0"/>
        <stop offset=".85" stop-color="#2a0c4f"/>
        <stop offset="1" stop-color="#12041f"/>
      </radialGradient>

      <clipPath id="fc-plaque-clip"><rect x="54" y="396" width="392" height="36"/></clipPath>
      <clipPath id="fc-skull-clip">
        <path d="M0 -32 C-18 -32 -28 -20 -28 -4 C-28 6 -23 13 -18 16 L-17 24 H17 L18 16 C23 13 28 6 28 -4 C28 -20 18 -32 0 -32 Z"/>
      </clipPath>
      <mask id="fc-no-art" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="700">
        <rect width="500" height="700" fill="#fff"/>
        <path d="M40 392 V160 Q40 100 250 70 Q460 100 460 160 V392 Z" fill="#000"/>
      </mask>

      <filter id="fc-iron" x="-3%" y="-3%" width="106%" height="106%">
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="2" result="grain"/>
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="9" result="blotch"/>
        <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="bevel"/>
        <feComposite in="bevel" in2="grain" operator="arithmetic" k1="0" k2="1" k3="0.25" k4="0" result="bump"/>
        <feDiffuseLighting in="bump" surfaceScale="4" lighting-color="#6f6280" result="diff">
          <feDistantLight azimuth="300" elevation="40"/>
        </feDiffuseLighting>
        <feSpecularLighting in="bump" surfaceScale="4" specularConstant=".7" specularExponent="28" lighting-color="#d8c8f0" result="spec">
          <fePointLight x="420" y="-120" z="300"/>
        </feSpecularLighting>
        <feColorMatrix in="blotch" values="0 0 0 0 .3  0 0 0 0 .12  0 0 0 0 .45  0 0 0 1.2 -.55" result="rust"/>
        <feComposite in="diff" in2="spec" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
        <feComposite in="rust" in2="lit" operator="over" result="lit2"/>
        <feComposite in="lit2" in2="SourceAlpha" operator="in"/>
      </filter>

      <filter id="fc-bone" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="6" result="pits"/>
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="round"/>
        <feComposite in="round" in2="pits" operator="arithmetic" k1="0" k2="1" k3="0.15" k4="0" result="bump"/>
        <feDiffuseLighting in="bump" surfaceScale="3" lighting-color="#e9e0cf" result="diff">
          <feDistantLight azimuth="300" elevation="45"/>
        </feDiffuseLighting>
        <feSpecularLighting in="bump" surfaceScale="3" specularConstant=".35" specularExponent="14" lighting-color="#ffffff" result="spec">
          <feDistantLight azimuth="300" elevation="45"/>
        </feSpecularLighting>
        <feBlend in="SourceGraphic" in2="diff" mode="multiply" result="tinted"/>
        <feComposite in="tinted" in2="spec" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
        <feComposite in="lit" in2="SourceAlpha" operator="in"/>
      </filter>

      <filter id="fc-leather" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="4" seed="14" result="n"/>
        <feDiffuseLighting in="n" surfaceScale="1.6" lighting-color="#4a3a56" result="d">
          <feDistantLight azimuth="235" elevation="55"/>
        </feDiffuseLighting>
        <feComposite in="d" in2="SourceGraphic" operator="in"/>
      </filter>

      <filter id="fc-grime" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="17"/>
        <feColorMatrix values="0 0 0 0 .06  0 0 0 0 .04  0 0 0 0 .05  0 0 0 1.8 -.8"/>
      </filter>

      <g id="fc-skull">
        <path filter="url(#fc-bone)" fill="url(#fc-cranium)" d="M0 -32 C-18 -32 -28 -20 -28 -4 C-28 6 -23 13 -18 16 L-17 24 H17 L18 16 C23 13 28 6 28 -4 C28 -20 18 -32 0 -32 Z"/>
        <g clip-path="url(#fc-skull-clip)">
          <ellipse cx="-25" cy="-2" rx="8" ry="15" fill="#000" opacity=".45" filter="url(#fb-blur4)"/>
          <ellipse cx="25" cy="-2" rx="8" ry="15" fill="#000" opacity=".3" filter="url(#fb-blur4)"/>
          <ellipse cx="0" cy="20" rx="20" ry="6" fill="#000" opacity=".35" filter="url(#fb-blur4)"/>
        </g>
        <path d="M-18 -10 Q-9 -15 0 -12 Q9 -15 18 -10" fill="none" stroke="#fff" stroke-width="1.4" opacity=".22"/>
        <ellipse cx="-15" cy="9" rx="5" ry="2.6" fill="#fff" opacity=".16"/>
        <ellipse cx="15" cy="9" rx="5" ry="2.6" fill="#fff" opacity=".12"/>
        <path fill="url(#fc-socket)" d="M-16 -6 C-16 -12 -10 -14 -5 -12 C-2 -10 -2 -2 -6 1 C-11 3 -16 0 -16 -6 Z"/>
        <path fill="url(#fc-socket)" d="M16 -6 C16 -12 10 -14 5 -12 C2 -10 2 -2 6 1 C11 3 16 0 16 -6 Z"/>
        <circle class="cf-eye-glow" cx="-9" cy="-5" r="2.2" fill="#b77aff" filter="url(#fb-glow)"/>
        <circle class="cf-eye-glow" cx="9" cy="-5" r="2.2" fill="#b77aff" filter="url(#fb-glow)"/>
        <path d="M0 4 L-4 12 Q0 14 4 12 Z" fill="#0a0608"/>
        <path d="M0 5 V12" stroke="#3a322c" stroke-width=".6"/>
        <rect x="-15" y="15" width="30" height="10" rx="2" fill="#0a0608"/>
        <g fill="url(#fc-cranium)">
          <rect x="-14" y="16" width="3.4" height="8" rx="1.2"/>
          <rect x="-10" y="16" width="3.4" height="8" rx="1.2"/>
          <rect x="-6" y="16" width="3.4" height="8" rx="1.2"/>
          <rect x="-2" y="16" width="3.4" height="8" rx="1.2"/>
          <rect x="2" y="16" width="3.4" height="8" rx="1.2"/>
          <rect x="6" y="16" width="3.4" height="8" rx="1.2"/>
          <rect x="10" y="16" width="3.4" height="8" rx="1.2"/>
        </g>
        <path d="M4 -31 L2 -24 L7 -19 L3 -12 M-20 -18 L-16 -14 L-18 -9" fill="none" stroke="#2a2220" stroke-width=".8"/>
      </g>

      <g id="fc-vertebra">
        <rect x="-6" y="0" width="12" height="13" rx="4" fill="url(#fc-bone-grad)"/>
        <path d="M-9 5.5 L-6 3.5 V9.5 L-9 7.5 Z M9 5.5 L6 3.5 V9.5 L9 7.5 Z" fill="url(#fc-bone-grad)"/>
      </g>

      <g id="fc-bracket" fill="#2a2430" filter="url(#fc-iron)">
        <path d="M16 76 V30 A14 14 0 0 1 30 16 H76 V28 H40 A12 12 0 0 0 28 40 V76 Z"/>
        <circle cx="22" cy="68" r="3.4"/>
        <circle cx="68" cy="22" r="3.4"/>
        <circle cx="23" cy="23" r="3.4"/>
      </g>

      <g id="fc-gem" class="cf-gem">
        <circle r="11" fill="#2a2430" filter="url(#fc-iron)"/>
        <path d="M0 -8 L8 0 L0 8 L-8 0 Z" fill="url(#fc-amethyst)"/>
        <path d="M0 -8 L8 0 L0 0 Z" fill="#fff" opacity=".25"/>
        <path d="M-8 0 L0 8 L0 0 Z" fill="#000" opacity=".3"/>
        <path d="M1.5 -5 L2 -3 L4 -2.5 L2 -2 L1.5 0 L1 -2 L-1 -2.5 L1 -3 Z" fill="#fff"/>
      </g>
    </defs>
  </svg>

  <!-- ================================================================
       Page
       ================================================================ -->
  <canvas id="motes" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="back-link" href="index.html">Back to title</a>
    <h1 class="page-title">Card library</h1>
    <nav class="kingdom-tabs" aria-label="Kingdoms">
      <button class="tab is-active" aria-pressed="true">Duskmoor</button>
    </nav>
  </header>

  <main>
    <p class="count" id="card-count"></p>
    <div class="card-grid" id="card-grid"></div>
  </main>

  <dialog class="inspect" id="inspect" aria-label="Inspect card">
    <div class="inspect-stage" id="inspect-stage"></div>
    <div class="inspect-actions">
      <button class="action" id="flip-btn">Flip card</button>
