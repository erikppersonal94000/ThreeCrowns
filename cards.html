<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Library · Three Crowns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cards.css">
  <script src="js/smoke.js"></script>
</head>
<body>
  <!-- Materials and shapes used by every card frame -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- ================= Hero frame (painted pewter & enamel) ================= -->
      <linearGradient id="fb-metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a4058"/>
        <stop offset=".35" stop-color="#1d1726"/>
        <stop offset=".5" stop-color="#0e0a14"/>
        <stop offset=".75" stop-color="#2a2236"/>
        <stop offset="1" stop-color="#120d19"/>
      </linearGradient>
      <linearGradient id="fb-metal-h" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5a4d6c"/>
        <stop offset=".5" stop-color="#1a1422"/>
        <stop offset="1" stop-color="#34293f"/>
      </linearGradient>
      <linearGradient id="fb-panel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a1422"/>
        <stop offset="1" stop-color="#0b0810"/>
      </linearGradient>
      <radialGradient id="fb-enamel" cx=".5" cy=".4" r=".7">
        <stop offset="0" stop-color="#4a1f7a"/>
        <stop offset="1" stop-color="#1c0a33"/>
      </radialGradient>
      <linearGradient id="fb-inset" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#171021"/>
        <stop offset="1" stop-color="#0a0710"/>
      </linearGradient>
      <linearGradient id="fb-bone" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f2ecf5"/>
        <stop offset=".5" stop-color="#b9aec4"/>
        <stop offset="1" stop-color="#5d546a"/>
      </linearGradient>
      <linearGradient id="fb-horn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a3e56"/>
        <stop offset="1" stop-color="#0e0a12"/>
      </linearGradient>
      <linearGradient id="fb-crescent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e6ccff"/>
        <stop offset=".5" stop-color="#9b5ce6"/>
        <stop offset="1" stop-color="#3b1466"/>
      </linearGradient>
      <radialGradient id="cf-gem-radial" cx=".4" cy=".35" r=".7">
        <stop offset="0" stop-color="#f0dcff"/>
        <stop offset=".35" stop-color="#9b5ce6"/>
        <stop offset=".8" stop-color="#3b1466"/>
        <stop offset="1" stop-color="#1a0830"/>
      </radialGradient>
      <radialGradient id="cf-art-vignette" cx=".5" cy=".42" r=".75">
        <stop offset=".5" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".85"/>
      </radialGradient>

      <!-- card back -->
      <radialGradient id="cb-bg" cx=".5" cy=".45" r=".75">
        <stop offset="0" stop-color="#2a1340"/>
        <stop offset=".6" stop-color="#110a1a"/>
        <stop offset="1" stop-color="#050308"/>
      </radialGradient>
      <pattern id="cb-lattice" patternUnits="userSpaceOnUse" width="40" height="40">
        <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="none" stroke="#2a1a3d" stroke-width="1"/>
      </pattern>

      <!-- ================= Attack card materials ================= -->
      <!-- empty art (until a card gets its picture) -->
      <radialGradient id="ac-empty" cx=".5" cy=".45" r=".7">
        <stop offset="0" stop-color="#2a1640"/>
        <stop offset=".6" stop-color="#140a20"/>
        <stop offset="1" stop-color="#07040b"/>
      </radialGradient>

      <!-- Common: rough grey stone -->
      <linearGradient id="st-stone" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#b3b0ba"/>
        <stop offset=".5" stop-color="#85828c"/>
        <stop offset="1" stop-color="#9d9aa4"/>
      </linearGradient>
      <radialGradient id="st-empty" cx=".5" cy=".45" r=".7">
        <stop offset="0" stop-color="#2c2a31"/>
        <stop offset=".6" stop-color="#17161a"/>
        <stop offset="1" stop-color="#09080b"/>
      </radialGradient>

      <!-- Uncommon: bone -->
      <linearGradient id="bn-bone" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f3ecdc"/>
        <stop offset=".5" stop-color="#cfc3aa"/>
        <stop offset="1" stop-color="#a39679"/>
      </linearGradient>

      <!-- Rare: obsidian & amethyst -->
      <linearGradient id="ob-obsidian" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2e2440"/>
        <stop offset=".45" stop-color="#0a0710"/>
        <stop offset=".7" stop-color="#1c1428"/>
        <stop offset="1" stop-color="#06040a"/>
      </linearGradient>
      <linearGradient id="ob-amethyst" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f0dcff"/>
        <stop offset=".4" stop-color="#a86cf0"/>
        <stop offset="1" stop-color="#3b1466"/>
      </linearGradient>

      <!-- Legendary: blackened gold -->
      <linearGradient id="lg-gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f3d487"/>
        <stop offset=".35" stop-color="#9a7430"/>
        <stop offset=".6" stop-color="#3a2810"/>
        <stop offset="1" stop-color="#c9a052"/>
      </linearGradient>
      <radialGradient id="lg-art" cx=".5" cy=".42" r=".7">
        <stop offset="0" stop-color="#4a1a66"/>
        <stop offset=".45" stop-color="#1e0b2e"/>
        <stop offset="1" stop-color="#06030a"/>
      </radialGradient>

      <!-- ================= Clips ================= -->
      <clipPath id="cf-arch">
        <path d="M40 392 V160 Q40 100 250 70 Q460 100 460 160 V392 Z"/>
      </clipPath>
      <clipPath id="fb-tb-clip"><rect x="48" y="476" width="404" height="148" rx="6"/></clipPath>
      <clipPath id="fb-heart-clip">
        <path d="M440 686 C414 668 402 654 402 640 C402 628 411 620 421 620 C430 620 436 626 440 632 C444 626 450 620 459 620 C469 620 478 628 478 640 C478 654 466 668 440 686 Z"/>
      </clipPath>

      <!-- ================= Filters ================= -->
      <!-- brushed metal + bevel -->
      <filter id="fb-metalfx" x="-3%" y="-3%" width="106%" height="106%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9 0.22" numOctaves="2" seed="5" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0" result="g"/>
        <feComponentTransfer in="g" result="lift">
          <feFuncR type="linear" slope=".35" intercept=".8"/>
          <feFuncG type="linear" slope=".35" intercept=".8"/>
          <feFuncB type="linear" slope=".35" intercept=".8"/>
          <feFuncA type="linear" slope="0" intercept="1"/>
        </feComponentTransfer>
        <feBlend in="SourceGraphic" in2="lift" mode="multiply" result="tex"/>
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="bump"/>
        <feSpecularLighting in="bump" surfaceScale="3.5" specularConstant=".8" specularExponent="20" lighting-color="#d9c4ff" result="spec">
          <fePointLight x="420" y="-120" z="260"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
        <feComposite in="tex" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
        <feComposite in="lit" in2="SourceAlpha" operator="in"/>
      </filter>

      <!-- glossy bone (hero details) -->
      <filter id="fb-bonefx" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="bump"/>
        <feSpecularLighting in="bump" surfaceScale="2.5" specularConstant=".6" specularExponent="16" lighting-color="#ffffff" result="spec">
          <fePointLight x="420" y="-120" z="260"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="s"/>
        <feComposite in="SourceGraphic" in2="s" operator="arithmetic" k1="0" k2="1" k3=".8" k4="0"/>
      </filter>

      <!-- painted canvas grain -->
      <filter id="fb-canvasfx" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="3" seed="12" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0" result="g"/>
        <feComponentTransfer in="g" result="lift">
          <feFuncR type="linear" slope=".5" intercept=".7"/>
          <feFuncG type="linear" slope=".5" intercept=".7"/>
          <feFuncB type="linear" slope=".5" intercept=".7"/>
          <feFuncA type="linear" slope="0" intercept="1"/>
        </feComponentTransfer>
        <feBlend in="SourceGraphic" in2="lift" mode="multiply" result="t"/>
        <feComposite in="t" in2="SourceGraphic" operator="in"/>
      </filter>

      <!-- rough chipped stone -->
      <filter id="st-stonefx" x="-3%" y="-3%" width="106%" height="106%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="31" result="grain"/>
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="32" result="blotch"/>
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="bevel"/>
        <feComposite in="bevel" in2="grain" operator="arithmetic" k1="0" k2="1" k3="0.35" k4="0" result="bump0"/>
        <feComposite in="bump0" in2="blotch" operator="arithmetic" k1="0" k2="1" k3="0.25" k4="0" result="bump"/>
        <feDiffuseLighting in="bump" surfaceScale="3" lighting-color="#8f8b96" result="diff">
          <feDistantLight azimuth="300" elevation="42"/>
        </feDiffuseLighting>
        <feBlend in="SourceGraphic" in2="diff" mode="multiply" result="tinted"/>
        <feComposite in="tinted" in2="SourceAlpha" operator="in"/>
      </filter>

      <!-- weathered, pitted bone -->
      <filter id="bn-bonefx" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="6" result="pits"/>
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="round"/>
        <feComposite in="round" in2="pits" operator="arithmetic" k1="0" k2="1" k3="0.15" k4="0" result="bump"/>
        <feDiffuseLighting in="bump" surfaceScale="3" lighting-color="#f2ead9" result="diff">
          <feDistantLight azimuth="300" elevation="45"/>
        </feDiffuseLighting>
        <feSpecularLighting in="bump" surfaceScale="3" specularConstant=".35" specularExponent="14" lighting-color="#ffffff" result="spec">
          <feDistantLight azimuth="300" elevation="45"/>
        </feSpecularLighting>
        <feBlend in="SourceGraphic" in2="diff" mode="multiply" result="tinted"/>
        <feComposite in="tinted" in2="spec" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
        <feComposite in="lit" in2="SourceAlpha" operator="in"/>
      </filter>

      <!-- glossy obsidian -->
      <filter id="ob-glossfx" x="-3%" y="-3%" width="106%" height="106%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="bump"/>
        <feSpecularLighting in="bump" surfaceScale="5" specularConstant="1" specularExponent="35" lighting-color="#d8b8ff" result="spec">
          <fePointLight x="380" y="-160" z="320"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="s"/>
        <feComposite in="SourceGraphic" in2="s" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
      </filter>

      <!-- violet glow around crystals -->
      <filter id="ob-crystalglow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
        <feColorMatrix in="b" values="0 0 0 0 .6  0 0 0 0 .3  0 0 0 0 .95  0 0 0 .9 0" result="c"/>
        <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <filter id="fb-glow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="fb-blur4" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4"/>
      </filter>

      <!-- ================= Reusable pieces ================= -->
      <g id="fb-skull">
        <path fill="url(#fb-bone)" d="M0 -22 C-14 -22 -20 -11 -20 -1 C-20 7 -16 12 -12 14 V21 H12 V14 C16 12 20 7 20 -1 C20 -11 14 -22 0 -22 Z"/>
        <path fill="#000" opacity=".35" d="M-20 -1 C-20 7 -16 12 -12 14 V21 H-2 V12 C-9 10 -15 6 -16 -4 Z"/>
        <path fill="#fff" opacity=".35" d="M-10 -18 Q2 -23 12 -16 Q2 -19 -10 -18 Z"/>
        <ellipse cx="-7" cy="0" rx="5" ry="5.5" fill="#07040b"/>
        <ellipse cx="7" cy="0" rx="5" ry="5.5" fill="#07040b"/>
        <path d="M0 5 L-2.6 10 Q0 11 2.6 10 Z" fill="#07040b"/>
        <path d="M-12 14 H12 M-8 15.5 V21 M-4 15.5 V21 M0 15.5 V21 M4 15.5 V21 M8 15.5 V21" stroke="#3a3144" stroke-width=".8"/>
        <path d="M3 -21 L1 -14 L5 -10 L2 -4" fill="none" stroke="#3a3144" stroke-width=".8"/>
        <circle class="cf-eye-glow" cx="-7" cy="1" r="2.2" fill="#c08cff" filter="url(#fb-glow)"/>
        <circle class="cf-eye-glow" cx="7" cy="1" r="2.2" fill="#c08cff" filter="url(#fb-glow)"/>
      </g>

      <g id="fb-vertebra">
        <rect x="-5.5" y="0" width="11" height="14" rx="3.5" fill="url(#fb-bone)"/>
        <path d="M-8 6 L-5.5 4.5 V9.5 L-8 8 Z M8 6 L5.5 4.5 V9.5 L8 8 Z" fill="url(#fb-bone)"/>
        <rect x="-5.5" y="10" width="11" height="4" rx="2" fill="#000" opacity=".3"/>
      </g>

      <g id="fb-bone-piece">
        <rect x="-18" y="-3" width="36" height="6" rx="3" fill="url(#fb-bone)"/>
        <circle cx="-18" cy="-3.2" r="4" fill="url(#fb-bone)"/><circle cx="-18" cy="3.2" r="4" fill="url(#fb-bone)"/>
        <circle cx="18" cy="-3.2" r="4" fill="url(#fb-bone)"/><circle cx="18" cy="3.2" r="4" fill="url(#fb-bone)"/>
        <rect x="-18" y="1" width="36" height="2" rx="1" fill="#000" opacity=".3"/>
      </g>

      <g id="fb-gem" class="cf-gem">
        <path d="M0 -9 L9 0 L0 9 L-9 0 Z" fill="#2a0c4f"/>
        <path d="M0 -9 L9 0 L0 0 Z" fill="#e3c6ff"/>
        <path d="M0 -9 L-9 0 L0 0 Z" fill="#9b5ce6"/>
        <path d="M-9 0 L0 9 L0 0 Z" fill="#5b24a0"/>
        <path d="M9 0 L0 9 L0 0 Z" fill="#7a3cd0"/>
        <path d="M0 -9 L9 0 L0 9 L-9 0 Z" fill="none" stroke="#0a0610" stroke-width="1"/>
        <circle cx="2" cy="-3" r="1.2" fill="#fff"/>
      </g>

      <!-- a single tongue of shadow-flame (legendary) -->
      <g id="lg-flame">
        <path d="M0 0 C-9 -6 -8 -18 0 -34 C8 -18 9 -6 0 0 Z" fill="#b02fd0" opacity=".85"/>
        <path d="M0 -2 C-5 -6 -4 -14 0 -24 C4 -14 5 -6 0 -2 Z" fill="#f2c8ff"/>
      </g>
    </defs>
  </svg>

  <canvas id="motes" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="back-link" href="duskmoor.html" data-smoke>Back to Duskmoor</a>
    <h1 class="page-title">Card library</h1>
    <nav class="kingdom-tabs" aria-label="Kingdoms">
      <button class="tab is-active" aria-pressed="true">Duskmoor</button>
    </nav>
  </header>

  <main>
    <p class="count" id="card-count"></p>
    <div class="card-grid" id="card-grid"></div>
  </main>

  <!-- Large inspect view -->
  <dialog class="inspect" id="inspect" aria-label="Inspect card">
    <div class="inspect-stage" id="inspect-stage"></div>
    <div class="inspect-actions">
      <button class="action" id="flip-btn">Flip card</button>
      <button class="action" id="close-btn">Close</button>
    </div>
  </dialog>

  <script src="js/cards.js"></script>
</body>
</html>
