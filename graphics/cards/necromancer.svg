<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 332">
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#3d1b5c"/>
      <stop offset="0.45" stop-color="#170c24"/>
      <stop offset="1" stop-color="#050308"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1230"/>
      <stop offset="0.5" stop-color="#0e0816"/>
      <stop offset="1" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e1ec"/>
      <stop offset="1" stop-color="#8a8194"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#e2c4ff"/>
      <stop offset="0.6" stop-color="#9b5ce6"/>
      <stop offset="1" stop-color="#3b1466" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8a4dd6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8a4dd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.72">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.8"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="wisp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <g id="bonebit">
      <rect x="-12" y="-2.2" width="24" height="4.4" rx="2.2"/>
      <circle cx="-12" cy="-2.4" r="3"/><circle cx="-12" cy="2.4" r="3"/>
      <circle cx="12" cy="-2.4" r="3"/><circle cx="12" cy="2.4" r="3"/>
    </g>
    <g id="skullbit">
      <path d="M0 -9 C-6 -9 -8.5 -4.5 -8.5 -0.5 C-8.5 3 -6.8 5 -5 6 V9 H5 V6 C6.8 5 8.5 3 8.5 -0.5 C8.5 -4.5 6 -9 0 -9 Z"/>
      <ellipse cx="-3.2" cy="0" rx="2.2" ry="2.5" fill="#0a0610"/>
      <ellipse cx="3.2" cy="0" rx="2.2" ry="2.5" fill="#0a0610"/>
      <path d="M0 2.5 L-1.2 5 H1.2 Z" fill="#0a0610"/>
    </g>
  </defs>

  <!-- night sky and moon -->
  <rect width="420" height="332" fill="url(#sky)"/>
  <circle cx="330" cy="62" r="48" fill="#b89be0" opacity="0.18" filter="url(#soft)"/>
  <circle cx="330" cy="62" r="30" fill="#d8c8ef" opacity="0.28"/>

  <!-- distant spires of Duskmoor -->
  <path fill="#1a1027" d="M14 262 V190 L22 176 L30 190 V206 L40 120 L50 206 V188 L58 172 L66 188 V262 Z"/>
  <path fill="#150d20" d="M360 262 V214 L368 204 L376 214 V200 L386 150 L396 200 V222 L404 212 L412 222 V262 Z"/>

  <!-- aura behind the necromancer -->
  <ellipse cx="210" cy="170" rx="170" ry="150" fill="url(#aura)"/>

  <!-- graves -->
  <g fill="#120a1c">
    <path d="M52 298 V266 a14 14 0 0 1 28 0 V298 Z" transform="rotate(-6 66 298)"/>
    <path d="M342 298 V260 a16 16 0 0 1 32 0 V298 Z" transform="rotate(5 358 298)"/>
    <path d="M300 298 V272 H292 V266 H300 V256 H306 V266 H314 V272 H306 V298 Z"/>
    <path d="M104 298 V278 a10 10 0 0 1 20 0 V298 Z"/>
  </g>

  <!-- ground and mist -->
  <path fill="#08050d" d="M0 292 Q100 282 210 294 Q320 284 420 292 V332 H0 Z"/>
  <g fill="#6a3aa0" opacity="0.35" filter="url(#soft)">
    <ellipse cx="90" cy="298" rx="90" ry="14"/>
    <ellipse cx="330" cy="300" rx="100" ry="12"/>
    <ellipse cx="210" cy="306" rx="120" ry="10"/>
  </g>

  <!-- skeletal hands clawing out of the graves -->
  <g fill="#b36bff" opacity="0.6" filter="url(#soft)">
    <ellipse cx="87" cy="300" rx="20" ry="6"/>
    <ellipse cx="341" cy="300" rx="20" ry="6"/>
  </g>
  <g stroke="url(#bone)" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M84 300 L80 264 M90 300 L87 264"/>
    <path d="M80 262 L73 244 M82 260 L79 240 M85 260 L86 239 M88 262 L93 245 M89 266 L97 258"/>
    <path d="M336 300 L340 266 M342 300 L346 266"/>
    <path d="M339 264 L333 248 M341 262 L339 243 M344 262 L346 242 M347 264 L353 249 M337 268 L330 261"/>
  </g>
  <g fill="url(#bone)">
    <ellipse cx="84" cy="262" rx="5.5" ry="4"/>
    <ellipse cx="342" cy="264" rx="5.5" ry="4"/>
  </g>

  <!-- spirits rising from the hands -->
  <g fill="none" stroke="#c9a2ff" stroke-width="1.8" stroke-linecap="round" opacity="0.5" filter="url(#wisp)">
    <path d="M84 256 C78 220 96 190 88 150"/>
    <path d="M342 258 C350 220 332 190 344 150"/>
  </g>

  <!-- robe -->
  <path fill="url(#robe)" d="M210 70 C186 72 176 96 178 118 C160 130 150 160 146 200 C140 240 130 268 118 300 L140 292 L150 304 L166 294 L180 306 L194 296 L210 308 L226 296 L240 306 L254 294 L270 304 L280 292 L302 300 C290 268 280 240 274 200 C270 160 260 130 242 118 C244 96 234 72 210 70 Z"/>
  <g fill="none" stroke="#000" stroke-width="1.5" opacity="0.5">
    <path d="M196 140 Q188 220 170 296"/>
    <path d="M224 140 Q232 220 250 296"/>
    <path d="M210 180 V300"/>
  </g>
  <!-- violet rim light and hood trim -->
  <path d="M242 118 C260 130 270 160 274 200 C280 240 290 268 302 300" fill="none" stroke="#8a4dd6" stroke-width="1.5" opacity="0.6"/>
  <path d="M178 118 C176 96 186 72 210 70 C234 72 244 96 242 118" fill="none" stroke="#6b3aa8" stroke-width="2" opacity="0.8"/>

  <!-- hood void and glowing eyes -->
  <path fill="#000" d="M210 84 C196 86 190 100 192 116 C196 126 204 132 210 132 C216 132 224 126 228 116 C230 100 224 86 210 84 Z"/>
  <g fill="#d4a8ff" filter="url(#glow)">
    <circle cx="202" cy="110" r="2.8"/>
    <circle cx="218" cy="110" r="2.8"/>
  </g>

  <!-- ribcage showing through the robe -->
  <path fill="#120a1a" d="M198 134 L210 176 L222 134 Z"/>
  <g fill="none" stroke="url(#bone)" stroke-width="1.4" stroke-linecap="round">
    <path d="M201 142 Q210 146 219 142 M203 150 Q210 154 217 150 M205 158 Q210 161 215 158 M207 166 Q210 168 213 166"/>
    <path d="M210 138 V170"/>
  </g>

  <!-- belt of skulls -->
  <path d="M150 180 Q210 196 270 180" fill="none" stroke="#2a1a3d" stroke-width="3"/>
  <g fill="url(#bone)">
    <use href="#skullbit" transform="translate(186 186) scale(0.55)"/>
    <use href="#skullbit" transform="translate(198 189) scale(0.55)"/>
    <use href="#skullbit" transform="translate(210 190) scale(0.55)"/>
    <use href="#skullbit" transform="translate(222 189) scale(0.55)"/>
    <use href="#skullbit" transform="translate(234 186) scale(0.55)"/>
  </g>

  <!-- skull pauldrons with spikes -->
  <path fill="url(#bone)" d="M168 118 L162 104 L174 114 Z M252 118 L258 104 L246 114 Z"/>
  <g fill="url(#bone)">
    <use href="#skullbit" transform="translate(180 124) scale(1.2)"/>
    <use href="#skullbit" transform="translate(240 124) scale(1.2)"/>
  </g>

  <!-- left arm raised to the staff -->
  <path fill="url(#robe)" d="M184 128 C166 122 148 104 136 88 L126 98 C140 120 160 140 178 150 Z"/>

  <!-- spine staff with burning skull -->
  <path d="M128 50 L118 296" stroke="url(#bone)" stroke-width="5" stroke-linecap="round"/>
  <path d="M128 50 L118 296" stroke="#cfc6d6" stroke-width="9" stroke-dasharray="3 16" stroke-linecap="round"/>
  <use href="#skullbit" fill="url(#bone)" transform="translate(128 40) scale(1.4)"/>
  <path fill="#b36bff" opacity="0.95" filter="url(#glow)" d="M128 28 C117 20 121 8 127 0 C129 8 137 12 135 20 C139 16 139 10 138 6 C145 14 141 26 128 28 Z"/>
  <!-- bony fingers gripping the staff -->
  <path d="M121 90 H133 M120 96 H132 M121 102 H131" stroke="url(#bone)" stroke-width="2" stroke-linecap="round"/>

  <!-- right arm raising the soul orb -->
  <path fill="url(#robe)" d="M236 128 C256 120 276 102 290 86 L300 94 C288 116 266 140 244 150 Z"/>
  <ellipse cx="296" cy="84" rx="5" ry="6" fill="url(#bone)"/>
  <g stroke="url(#bone)" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M292 80 L286 66 M295 78 L293 62 M298 78 L300 62 M301 80 L307 66 M302 86 L310 82"/>
  </g>
  <circle cx="298" cy="48" r="26" fill="url(#orb)" opacity="0.35" filter="url(#soft)"/>
  <circle cx="298" cy="48" r="13" fill="url(#orb)" filter="url(#glow)"/>

  <!-- souls spiralling off the orb -->
  <g fill="none" stroke="#c9a2ff" stroke-width="1.8" stroke-linecap="round" opacity="0.6" filter="url(#wisp)">
    <path d="M298 46 C318 30 326 14 346 4"/>
    <path d="M296 44 C282 24 292 10 276 0"/>
    <path d="M300 50 C330 52 350 40 372 44"/>
  </g>

  <!-- bones scattered in the foreground -->
  <g fill="#9a90a4">
    <use href="#skullbit" transform="translate(52 318) scale(1.1) rotate(-12)"/>
    <use href="#skullbit" transform="translate(160 322) scale(0.9) rotate(8)"/>
    <use href="#skullbit" transform="translate(268 320) rotate(-5)"/>
    <use href="#skullbit" transform="translate(378 316) scale(1.2) rotate(10)"/>
    <use href="#bonebit" transform="translate(96 322) rotate(20)"/>
    <use href="#bonebit" transform="translate(212 326) rotate(-10)"/>
    <use href="#bonebit" transform="translate(320 324) rotate(35)"/>
    <use href="#bonebit" transform="translate(30 326) rotate(-40)"/>
    <use href="#bonebit" transform="translate(236 316) rotate(70) scale(0.8)"/>
  </g>

  <!-- vignette -->
  <rect width="420" height="332" fill="url(#vignette)"/>
</svg>